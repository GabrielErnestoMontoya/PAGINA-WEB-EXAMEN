<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendiendo CSS Grid Layout</title>
    <link rel="stylesheet" href="3styles.css">
</head>
<body>

    
    <h1 class="main-title">Aprendiendo CSS Grid Layout con Víctor Robles WEB</h1>

    
    <div class="grid-container">
        
        <header class="box cabecera">
            CABECERA
        </header>

        <nav class="box menu">
            MENU
        </nav>

        <main class="box contenido">
            CONTENIDO

            BARRA LATERAL
        </aside>

        <footer class="box footer">
            PIE PAGINA
        </footer>

    </div>

</body>
